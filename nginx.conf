server {
    listen 80;
    server_name _;
    # The editor builds each published version into /srv/site/releases/ and points "current" at it.
    root /srv/site/current;
    index index.html;

    # Keep redirects relative so they work behind a reverse proxy (Caddy, Traefik, Nginx Proxy Manager...).
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml font/woff application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro gives built assets content hashes, so they can be cached for good.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /videos/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Contact form -> the "contact" container. Looked up at request time, so the site still starts
    # (and the form falls back to email) if that container is missing.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_upstream http://contact:8000;
        proxy_pass $contact_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
