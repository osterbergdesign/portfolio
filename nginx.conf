server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so they work behind a reverse proxy (Caddy, Traefik, Nginx Proxy Manager...).
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml font/woff application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro gives built assets content hashes, so they can be cached for good.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404.html;
}
